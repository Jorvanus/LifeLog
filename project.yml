name: LifeLog
attributes:
  LastUpgradeCheck: 2700
options:
  bundleIdPrefix: com.aaronbaxter
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  LifeLog:
    type: application
    platform: iOS
    sources: [LifeLog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronbaxter.LifeLog
        MARKETING_VERSION: "1.27.0"
        CURRENT_PROJECT_VERSION: "66"
        INFOPLIST_FILE: LifeLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 337KNRL5L8
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: LifeLog/LifeLog.entitlements
      properties:
        # This value must remain aligned with the personal-team provisioning profile.
        # StoreProtection applies the background-compatible class to the SQLite
        # files after a successful foreground open.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.developer.healthkit: true
  LifeLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LifeLogTests]
    dependencies:
      - target: LifeLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronbaxter.LifeLogTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
  LifeLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LifeLogUITests]
    dependencies:
      - target: LifeLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronbaxter.LifeLogUITests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
schemes:
  LifeLog:
    build:
      targets:
        LifeLog: all
        LifeLogTests: [test]
        LifeLogUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LifeLogTests
        - LifeLogUITests
